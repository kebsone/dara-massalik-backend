spring:
  datasource:
    # These values are deliberately required: production must not fall back to local credentials.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  cors:
    # Comma-separated exact origins, e.g. https://dara.example.com
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      # No default in production. Generate a long random value and store it in Railway Variables.
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    refresh-token:
      expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}
  auth:
    otp:
      expiration-seconds: ${OTP_EXPIRATION_SECONDS:300}
      expose-dev-code: false
  sms:
    # SMS is intentionally disabled until a real provider is configured.
    provider: ${SMS_PROVIDER:disabled}
  uploads:
    student-photos-dir: ${UPLOADS_DIR:/app/uploads/student-photos}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Administrateur}
    last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:Dara Massalik}
    phone: ${BOOTSTRAP_ADMIN_PHONE:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
