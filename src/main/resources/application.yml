spring:
  application:
    name: dara-massalik-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dara_massalik}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-chars}
      # 360 minutes = 6 hours
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:2}
    refresh-token:
      # 7 days
      expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}
  auth:
    otp:
      expiration-seconds: ${OTP_EXPIRATION_SECONDS:300}
      expose-dev-code: ${OTP_EXPOSE_DEV_CODE:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.flywaydb: INFO
